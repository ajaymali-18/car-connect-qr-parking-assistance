<div class="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-[9999] flex flex-col gap-2 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto rounded-xl p-3.5 shadow-lg flex items-start gap-3 transition-all transform duration-200 animate-in fade-in slide-in-from-top-2"
      [ngClass]="{
        'bg-surface-container-lowest border-l-4 border-on-tertiary-container text-on-surface shadow-primary/10': toast.type === 'success',
        'bg-surface-container-lowest border-l-4 border-error text-on-surface shadow-primary/10': toast.type === 'error',
        'bg-surface-container-lowest border-l-4 border-secondary-container text-on-surface shadow-primary/10': toast.type === 'warning',
        'bg-primary-container text-on-primary shadow-primary/20': toast.type === 'info'
      }"
    >
      <span 
        class="material-symbols-outlined text-[20px] shrink-0 mt-0.5"
        [ngClass]="{
          'text-on-tertiary-container': toast.type === 'success',
          'text-error': toast.type === 'error',
          'text-secondary-container': toast.type === 'warning',
          'text-secondary-fixed': toast.type === 'info'
        }"
      >
        @if (toast.type === 'success') { check_circle }
        @else if (toast.type === 'error') { error }
        @else if (toast.type === 'warning') { warning }
        @else { info }
      </span>

      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <p class="font-label-md text-label-md font-bold leading-tight">{{ toast.title }}</p>
        }
        <p class="font-body-sm text-body-sm leading-snug">{{ toast.message }}</p>
      </div>

      <button 
        (click)="toastService.remove(toast.id)"
        class="text-outline hover:text-on-surface p-1 rounded-full shrink-0" 
        type="button">
        <span class="material-symbols-outlined text-[16px]">close</span>
      </button>
    </div>
  }
</div>
