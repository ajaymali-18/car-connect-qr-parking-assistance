<header class="fixed top-0 inset-x-0 h-16 bg-surface-container-lowest/90 backdrop-blur-md z-40 border-b border-surface-container flex items-center justify-between px-space-md max-w-2xl mx-auto">
  <div class="flex items-center gap-space-sm">
    @if (showBack) {
      <button 
        (click)="goBack()"
        class="w-9 h-9 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors cursor-pointer"
        type="button"
        aria-label="Go Back"
      >
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </button>
    } @else {
      <div class="w-9 h-9 rounded-xl bg-primary-container flex items-center justify-center text-on-primary overflow-hidden shadow-sm">
        <img 
          alt="Car Connect" 
          class="w-7 h-7 object-contain" 
          src="assets/images/logo.png"
          onerror="this.src='assets/images/logo.svg'"
        />
      </div>
    }

    <div class="flex flex-col">
      <h1 class="font-title-md text-title-md font-bold text-on-surface leading-tight">{{ title }}</h1>
      @if (subtitle) {
        <span class="font-label-sm text-label-sm text-on-surface-variant leading-none">{{ subtitle }}</span>
      }
    </div>
  </div>

  <div class="flex items-center gap-space-xs">
    @if (currentUser()) {
      <a routerLink="/profile" class="w-9 h-9 rounded-full overflow-hidden border-2 border-primary-container shadow-sm hover:ring-2 hover:ring-secondary-container transition-all">
        <img 
          alt="User Profile" 
          class="w-full h-full object-cover" 
          [src]="currentUser()?.avatarUrl || 'assets/images/avatar.png'"
          onerror="this.src='assets/images/avatar.svg'"
        />
      </a>
    } @else {
      <a routerLink="/login" class="font-label-md text-label-md font-semibold text-secondary-container hover:underline px-2 py-1">
        Sign In
      </a>
    }
  </div>
</header>
