<main class="flex-1 flex flex-col justify-between min-h-screen px-screen-edge-padding py-space-lg max-w-md mx-auto w-full bg-surface">
  <div class="flex flex-col w-full">
    <!-- Brand Header -->
    <header class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
      <div class="w-14 h-14 rounded-2xl bg-primary-container p-2.5 flex items-center justify-center shadow-lg mb-space-xs ring-4 ring-primary-container/10">
        <img 
          alt="Car Connect Logo" 
          class="w-full h-full object-contain" 
          src="assets/images/logo.png"
          onerror="this.src='assets/images/logo.svg'"
        />
      </div>
      <h1 class="font-headline-md text-headline-md font-extrabold text-on-surface tracking-tight">Create Account</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Secure your vehicle with instant QR parking relays</p>
    </header>

    <!-- Social Registration -->
    <div class="flex flex-col gap-space-sm mb-space-md">
      <button 
        (click)="registerWithGoogle()"
        type="button" 
        class="w-full h-12 rounded-xl bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md font-bold flex items-center justify-center gap-space-sm shadow-sm active:scale-[0.99] transition-all cursor-pointer"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <div class="relative flex items-center justify-center my-space-2xs">
        <div class="border-t border-surface-container-high w-full"></div>
        <span class="bg-surface px-space-sm font-label-sm text-label-sm text-on-surface-variant font-medium uppercase tracking-wider">or enter details</span>
      </div>
    </div>

    <!-- Registration Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-space-sm">
      <!-- Full Name -->
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md font-semibold text-on-surface" for="name">Full Name</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]">person</span>
          <input 
            id="name"
            formControlName="name"
            type="text" 
            placeholder="Alex Morgan" 
            class="w-full h-11 bg-surface-container-low rounded-xl pl-11 pr-4 font-body-md text-body-md text-on-surface border border-transparent focus:border-primary-container focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline"
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md font-semibold text-on-surface" for="email">Email Address</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]">mail</span>
          <input 
            id="email"
            formControlName="email"
            type="email" 
            placeholder="driver@domain.com" 
            class="w-full h-11 bg-surface-container-low rounded-xl pl-11 pr-4 font-body-md text-body-md text-on-surface border border-transparent focus:border-primary-container focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline"
          />
        </div>
      </div>

      <!-- Phone Number -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <label class="font-label-md text-label-md font-semibold text-on-surface" for="phone">Phone Number</label>
          <span class="font-label-sm text-[11px] text-on-tertiary-container font-semibold flex items-center gap-0.5">
            <span class="material-symbols-outlined text-[13px]">lock</span> 100% Masked & Private
          </span>
        </div>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]">call</span>
          <input 
            id="phone"
            formControlName="phone"
            type="tel" 
            placeholder="+1 (555) 019-2834" 
            class="w-full h-11 bg-surface-container-low rounded-xl pl-11 pr-4 font-body-md text-body-md text-on-surface border border-transparent focus:border-primary-container focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <label class="font-label-md text-label-md font-semibold text-on-surface" for="password">Password</label>
          <span class="font-label-sm text-[11px] font-bold" [ngClass]="passwordStrength.colorClass">
            {{ passwordStrength.label }}
          </span>
        </div>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]">lock</span>
          <input 
            id="password"
            formControlName="password"
            [type]="hidePassword ? 'password' : 'text'" 
            placeholder="At least 6 characters" 
            class="w-full h-11 bg-surface-container-low rounded-xl pl-11 pr-11 font-body-md text-body-md text-on-surface border border-transparent focus:border-primary-container focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline"
          />
          <button 
            (click)="togglePassword()"
            type="button" 
            class="absolute right-3.5 text-on-surface-variant hover:text-on-surface p-1 flex items-center cursor-pointer"
          >
            <span class="material-symbols-outlined text-[18px]">{{ hidePassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <!-- Password strength bar -->
        <div class="flex gap-1 h-1 mt-1 w-full bg-surface-container-high rounded-full overflow-hidden">
          <div class="h-full transition-all duration-300 rounded-full" [ngClass]="passwordStrength.bgClass" [style.width.%]="(passwordStrength.score / 3) * 100"></div>
        </div>
      </div>

      <!-- Terms & Privacy Checkbox -->
      <div class="flex items-start gap-2.5 mt-space-xs">
        <input 
          id="agreeTerms" 
          formControlName="agreeTerms" 
          type="checkbox" 
          class="mt-1 w-4 h-4 rounded text-secondary-container focus:ring-secondary-container border-outline-variant cursor-pointer"
        />
        <label for="agreeTerms" class="font-body-sm text-body-sm text-on-surface-variant leading-tight cursor-pointer">
          I agree to the <a href="#" class="text-secondary-container underline">Terms of Service</a> and allow private virtual relay of emergency notifications.
        </label>
      </div>

      <!-- Submit CTA Button -->
      <button 
        [disabled]="isLoading"
        type="submit" 
        class="w-full h-12 mt-space-xs rounded-xl bg-secondary-container hover:bg-secondary text-on-secondary font-label-md text-label-md font-bold shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60"
      >
        @if (isLoading) {
          <span class="material-symbols-outlined animate-spin text-[18px]">sync</span>
          <span>Creating Account...</span>
        } @else {
          <span>Create Account & Setup Pass</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        }
      </button>
    </form>
  </div>

  <!-- Sign In Footer -->
  <footer class="text-center mt-space-md">
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      Already have an account? 
      <a routerLink="/login" class="text-secondary-container font-bold hover:underline ml-1">Sign In</a>
    </p>
  </footer>
</main>
